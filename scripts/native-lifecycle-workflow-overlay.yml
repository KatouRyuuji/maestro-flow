          --dispatch-nonce "${{ inputs.dispatch_nonce }}"
      - uses: actions/upload-artifact@v4
        with:
          name: lifecycle-fs-darwin-x64-${{ inputs.source_sha }}
          path: .workflow/native-artifacts/darwin-x64
          if-no-files-found: error

  darwin-arm64:
    runs-on: macos-15
    steps:
      - name: Validate dispatch identity
        shell: bash
        run: |
          source_sha='${{ inputs.source_sha }}'
          nonce='${{ inputs.dispatch_nonce }}'
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid source_sha' >&2; exit 1; }
          [[ ${#nonce} -le 128 ]] || { echo 'dispatch_nonce exceeds 128 characters' >&2; exit 1; }
          [[ "$nonce" =~ ^maestro-search-ranking-exec-20260723-102551-20260724-010-plan-TASK-013-attempt-[1-9][0-9]{0,5}$ ]] || { echo 'invalid dispatch_nonce' >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Install Rust target
        run: rustup target add aarch64-apple-darwin
      - name: Build native helper
        run: cargo build --release --locked --manifest-path native/lifecycle-fs/Cargo.toml --target aarch64-apple-darwin
      - name: Run native tests
        run: cargo test --release --locked --manifest-path native/lifecycle-fs/Cargo.toml --target aarch64-apple-darwin
      - name: Probe protocol and write SHA-256 receipt
        run: >-
          node scripts/write-lifecycle-fs-native-receipt.mjs
          --job-id darwin-arm64
          --compiled-binary "native/lifecycle-fs/target/aarch64-apple-darwin/release/lifecycle-fs-helper"
          --output-root ".workflow/native-artifacts/darwin-arm64"
          --source-sha "${{ inputs.source_sha }}"
          --dispatch-nonce "${{ inputs.dispatch_nonce }}"
      - uses: actions/upload-artifact@v4
        with:
          name: lifecycle-fs-darwin-arm64-${{ inputs.source_sha }}
          path: .workflow/native-artifacts/darwin-arm64
          if-no-files-found: error

  aggregate:
    needs:
      - win32-x64
      - linux-x64
      - linux-arm64
      - darwin-x64
      - darwin-arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Validate dispatch identity
        shell: bash
        run: |
          source_sha='${{ inputs.source_sha }}'
          nonce='${{ inputs.dispatch_nonce }}'
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid source_sha' >&2; exit 1; }
          [[ ${#nonce} -le 128 ]] || { echo 'dispatch_nonce exceeds 128 characters' >&2; exit 1; }
          [[ "$nonce" =~ ^maestro-search-ranking-exec-20260723-102551-20260724-010-plan-TASK-013-attempt-[1-9][0-9]{0,5}$ ]] || { echo 'invalid dispatch_nonce' >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: lifecycle-fs-*-${{ inputs.source_sha }}
          path: .workflow/native-download
      - name: Verify exact receipts and uploaded bytes
        run: >-
          node scripts/verify-lifecycle-fs-native-aggregate.mjs
          --input-root ".workflow/native-download"
          --output-root ".workflow/native-aggregate"
          --source-sha "${{ inputs.source_sha }}"
          --dispatch-nonce "${{ inputs.dispatch_nonce }}"
      - uses: actions/upload-artifact@v4
        with:
          name: lifecycle-fs-aggregate-${{ inputs.source_sha }}
          path: .workflow/native-aggregate
          if-no-files-found: error
