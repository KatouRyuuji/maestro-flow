<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>MD 预览</title>
<link rel="icon" href="icons.svg" type="image/svg+xml" />
<link rel="stylesheet" href="themes.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--text);
    background: var(--bg);
    overflow-y: auto;
  }
  .preview-head {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border-bottom: 1px solid var(--border-soft);
    background: var(--bg);
  }
  .preview-head .logo { color: var(--accent); font-size: 13px; }
  .preview-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-strong);
    font: 650 12px/1.3 var(--mono);
  }
  .preview-kind { padding: 2px 7px; border: 1px solid var(--selection-border); border-radius: 5px; background: var(--selection-soft); color: var(--selection); font-size: 8.5px; font-weight: 650; letter-spacing: .4px; }
  .preview-body { padding: 18px 22px 40px; max-width: 860px; }
  .preview-body h1 { font-size: 19px; color: var(--text-strong); margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border-soft); }
  .preview-body h2 { font-size: 16px; color: var(--text-strong); margin: 18px 0 8px; }
  .preview-body h3 { font-size: 14px; color: var(--text-strong); margin: 16px 0 6px; }
  .preview-body h4 { font-size: 13px; color: var(--text-strong); margin: 14px 0 5px; }
  .preview-body p { margin: 8px 0; }
  .preview-body a { color: var(--accent); }
  .preview-body ul, .preview-body ol { margin: 8px 0; padding-left: 22px; }
  .preview-body li { margin: 3px 0; }
  .preview-body blockquote {
    margin: 10px 0;
    padding: 6px 12px;
    border-left: 3px solid var(--accent);
    background: var(--panel-soft);
    color: var(--text-dim);
    border-radius: 0 6px 6px 0;
  }
  .preview-body hr { margin: 18px 0; border: 0; border-top: 1px solid var(--border-soft); }
  .preview-body code {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--chip-bg);
    border: 1px solid var(--border-soft);
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--selection);
  }
  .preview-body pre {
    margin: 10px 0;
    padding: 12px 14px;
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    background: var(--surface-sunken);
    overflow-x: auto;
  }
  .preview-body pre code { background: transparent; border: 0; padding: 0; color: var(--text); }
  .preview-body table { border-collapse: collapse; margin: 10px 0; width: 100%; }
  .preview-body th, .preview-body td { border: 1px solid var(--border-soft); padding: 6px 10px; font-size: 12.5px; }
  .preview-body th { background: var(--panel-soft); color: var(--text-strong); }
  .preview-body strong { color: var(--text-strong); }
  .preview-error { padding: 40px 22px; text-align: center; color: var(--text-dim); }
  .preview-body { user-select: text; }
</style>
</head>
<body data-theme="graphite">
  <header class="preview-head">
    <span class="logo" aria-hidden="true">◆</span>
    <span class="preview-title" id="pvTitle">加载中…</span>
    <span class="preview-kind" id="pvKind">MD</span>
  </header>
  <main class="preview-body" id="pvBody"></main>
  <script src="preview.js"></script>
</body>
</html>
