<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>Maestro Sidebar · 编辑器</title>
<link rel="icon" href="icons.svg" type="image/svg+xml" />
<link rel="stylesheet" href="themes.css" />
<style>
  /* 基础 token（主窗口在 styles.css 定义；编辑器只加载 themes.css，需自带同款） */
  :root {
    --font: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    font-family: var(--font);
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
  }
  /* 键盘焦点在全部主题可见（对齐主窗口 v2.css 规则） */
  button:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  /* 文本域点击也命中 focus-visible：用柔和内嵌环而非高亮外框 */
  .ed-body textarea:focus-visible { outline: 1px solid var(--selection-border); outline-offset: -1px; }
  /* tab 栏 */
  .ed-tabs {
    display: flex;
    align-items: stretch;
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar) transparent;
    border-bottom: 1px solid var(--border-soft);
    background: var(--surface-sunken);
    min-height: 36px;
    flex: none;
  }
  .ed-tab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    max-width: 210px;
    padding: 7px 10px;
    border: 0;
    border-right: 1px solid var(--border-soft);
    background: transparent;
    color: var(--text-dim);
    font: 10px/1.3 var(--mono);
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .ed-tab:hover { background: var(--hover); color: var(--text); }
  .ed-tab.active { background: var(--panel); color: var(--text-strong); box-shadow: inset 0 -2px 0 var(--accent); }
  .ed-tab-t { overflow: hidden; text-overflow: ellipsis; }
  .ed-tab-x { flex: none; color: var(--text-dim); font-size: 12px; line-height: 1; padding: 1px 3px; border-radius: 3px; }
  .ed-tab-x:hover { color: var(--danger); background: var(--danger-soft); }
  .ed-tab-dot { flex: none; width: 5px; height: 5px; border-radius: 50%; background: var(--warn); }
  .ed-tabs .ed-spacer { flex: 1; }
  .ed-tabs .ed-new {
    border: 0;
    background: transparent;
    color: var(--accent);
    font-size: 18px;
    line-height: 1;
    padding: 0 14px;
    cursor: pointer;
    flex: none;
  }
  .ed-tabs .ed-new:hover { color: var(--selection); }
  /* toolbar */
  .ed-toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 10px;
    border-bottom: 1px solid var(--border-soft);
    background: var(--panel-soft);
    flex: none;
  }
  .ed-btn {
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    color: var(--text);
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  .ed-btn:hover { background: var(--hover); border-color: var(--selection-border); }
  .ed-btn.primary { border-color: var(--selection-border); background: var(--selection-soft); color: var(--selection); }
  .ed-btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, transparent); background: var(--danger-soft); }
  .ed-btn:disabled { opacity: .45; cursor: default; }
  .ed-dirty { color: var(--warn); font-size: 10px; }
  .ed-meta { margin-left: auto; color: var(--text-dim); font: 9px/1.3 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
  /* body */
  .ed-body { flex: 1; min-height: 0; display: flex; }
  .ed-body textarea {
    flex: 1;
    min-width: 0;
    border: 0;
    background: var(--surface-sunken);
    color: var(--text);
    font: 12px/1.7 var(--mono);
    padding: 14px 18px;
    resize: none;
    user-select: text;
  }
  .ed-preview {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 16px 20px 40px;
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar) transparent;
    user-select: text;
  }
  .ed-preview h1 { font-size: 19px; color: var(--text-strong); margin: 16px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border-soft); }
  .ed-preview h2 { font-size: 16px; color: var(--text-strong); margin: 14px 0 7px; }
  .ed-preview h3 { font-size: 14px; color: var(--text-strong); margin: 12px 0 6px; }
  .ed-preview p { margin: 7px 0; line-height: 1.75; }
  .ed-preview a { color: var(--accent); }
  .ed-preview ul, .ed-preview ol { margin: 7px 0; padding-left: 22px; }
  .ed-preview li { margin: 3px 0; }
  .ed-preview blockquote { margin: 9px 0; padding: 6px 12px; border-left: 3px solid var(--accent); background: var(--panel-soft); color: var(--text-dim); border-radius: 0 6px 6px 0; }
  .ed-preview pre { margin: 9px 0; padding: 12px 14px; border: 1px solid var(--border-soft); border-radius: 8px; background: var(--surface-sunken); overflow-x: auto; }
  .ed-preview pre code { font-family: var(--mono); font-size: 12px; color: var(--text); }
  .ed-preview code { font-family: var(--mono); font-size: 11px; background: var(--chip-bg); border: 1px solid var(--border-soft); border-radius: 4px; padding: 0 4px; color: var(--selection); }
  .ed-preview hr { margin: 16px 0; border: 0; border-top: 1px solid var(--border-soft); }
  .ed-preview table { border-collapse: collapse; margin: 9px 0; width: 100%; }
  .ed-preview th, .ed-preview td { border: 1px solid var(--border-soft); padding: 6px 10px; font-size: 12px; }
  .ed-preview th { background: var(--panel-soft); }
  /* status */
  .ed-status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-top: 1px solid var(--border-soft);
    background: var(--panel-soft);
    color: var(--text-dim);
    font-size: 10px;
    flex: none;
  }
  .ed-status .st-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); transition: background .2s; }
  .ed-status .st-dot.warn { background: var(--warn); }
  .ed-status .st-dot.error { background: var(--danger); }
  .ed-empty { display: flex; flex: 1; align-items: center; justify-content: center; color: var(--text-dim); font-size: 12px; }
  .ed-empty .hint { text-align: center; line-height: 2; }
  .ed-empty code { font-family: var(--mono); background: var(--chip-bg); padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body data-theme="graphite">
  <div class="ed-tabs" id="edTabs" role="tablist" aria-label="打开的文档">
    <button type="button" class="ed-new" id="edNew" title="新建条目" aria-label="新建条目">＋</button>
  </div>
  <div class="ed-toolbar">
    <button type="button" class="ed-btn primary" id="edSave" disabled>保存</button>
    <button type="button" class="ed-btn" id="edPreview">预览</button>
    <button type="button" class="ed-btn" id="edCopy">复制 ID</button>
    <button type="button" class="ed-btn danger" id="edDelete" disabled>删除</button>
    <span class="ed-dirty" id="edDirty"></span>
    <span class="ed-meta" id="edMeta"></span>
  </div>
  <div class="ed-body" id="edBody">
    <textarea id="edContent" spellcheck="false" aria-label="条目内容（Markdown / JSON）"></textarea>
    <div class="ed-preview" id="edPreviewPane" hidden></div>
  </div>
  <div class="ed-status">
    <span class="st-dot" id="stDot"></span>
    <span id="stText" role="status" aria-live="polite">就绪</span>
    <span style="margin-left:auto" id="stHint">Ctrl+S 保存 · 点击侧边栏条目可继续添加标签页</span>
  </div>
  <script src="md.js"></script>
  <script src="editor.js"></script>
</body>
</html>
