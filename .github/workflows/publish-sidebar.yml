name: Publish Maestro Sidebar

on:
  workflow_dispatch:
  push:
    tags:
      - "sidebar-v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: maestro-sidebar/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{ matrix.platform == 'macos-latest'
              && 'aarch64-apple-darwin,x86_64-apple-darwin'
              || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: maestro-sidebar/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: maestro-sidebar
        run: npm ci

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: maestro-sidebar
          tagName: ${{ github.ref_name }}
          releaseName: "Maestro Sidebar ${{ github.ref_name }}"
          releaseBody: |
            Maestro Sidebar desktop release.

            Download the installer for your operating system below.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
